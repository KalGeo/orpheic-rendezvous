# nginx in front of the rendezvous: wss://rv.example.org/rv → the rendezvous's Unix socket (RV_CONTROL_SOCKET).
# This is the block we run for rendezvous.orpheic.com, with the name swapped. Replace every rv.example.org with your
# server's name, put the file in /etc/nginx/sites-available/, link it from sites-enabled, then `nginx -t` and reload.
# A block of its OWN: only your rendezvous's name, never default_server; your other sites are not touched.
#
# The secret: /etc/orpheic-rendezvous/nginx-proxy-secret.conf, OUTSIDE /etc/nginx, so a copy of /etc/nginx never
# carries it; the folder is 0700 root and the file 0600 root (nginx's master reads it as root). ONE line:
#     proxy_set_header X-Orpheic-Proxy "<the value of RV_PROXY_SECRET>";
# Made on the server (see the README), never printed, never in git or in a backup. `nginx -T` prints it: never paste
# that output anywhere.

# One desktop's line is ONE connection; a whole carrier-grade NAT may share an address, so the same ceiling as the
# server's own per-address limit (32), keyed on the SAME address the server sees (X-Real-IP below):
# $realip_remote_addr, not $remote_addr, which real-IP rules at http level (a CDN's, for example) could rewrite. IPv4
# counts per address. IPv6 counts per /64: one host owns a whole /64 and could otherwise rotate addresses past any
# per-address ceiling. nginx has no mask for text addresses, so the /64 is rebuilt from the form nginx prints (RFC 5952:
# lower case, no leading zeros, the FIRST longest run of two or more zero groups written "::"). The regexes are tried
# in order and the first match wins: four groups written; "::" after three, two or one group (the zeros it stands for
# are put back); "a::b" followed by exactly four more groups, where b is still inside the /64. Named captures: nginx
# 1.11 or later. http context: files in sites-enabled are included there.
map $realip_remote_addr $orpheic_rv_peer {
    "~^(?<a>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"  $a;
    "~^(?<a>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"              "${a}:0";
    "~^(?<a>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                            "${a}:0:0";
    "~^(?<a>[0-9a-f]{1,4})::(?<b>[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"  "${a}:0:0:${b}";
    "~^(?<a>[0-9a-f]{1,4})::"                                          "${a}:0:0:0";
    default                                                            $realip_remote_addr;
}
limit_conn_zone $orpheic_rv_peer zone=orpheic_rv:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rv.example.org;

    ssl_certificate     /etc/letsencrypt/live/rv.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rv.example.org/privkey.pem;
    # Stated here, not inherited from the distribution's default: TLS 1.2 and 1.3 only (Orpheic pins the same).
    ssl_protocols TLSv1.2 TLSv1.3;

    # The rendezvous logs what it needs (registrations, counts); no second record of every desktop's address here.
    access_log off;
    client_header_timeout 10s;

    location = /rv {
        limit_conn orpheic_rv 32;
        proxy_pass http://unix:/run/orpheic-rv/control.sock:;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The address the TCP connection came from. $realip_remote_addr, not $remote_addr (see above). These two
        # proxy_set_header lines REPLACE anything the client sent under the same names.
        proxy_set_header X-Real-IP $realip_remote_addr;
        include /etc/orpheic-rendezvous/nginx-proxy-secret.conf;
        # Longer than BOTH pings: the desktop's (60 s) and the server's own (240 s, with a 60 s timeout), so the line
        # holds even if one side's ping stops. nginx's default of 60 s would cut the line every minute.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location / {
        return 404;
    }
}

# Port 80: ONLY for Let's Encrypt's HTTP-01 check (certbot certonly --webroot -w /var/www/letsencrypt), everything
# else 404.
server {
    listen 80;
    listen [::]:80;
    server_name rv.example.org;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
